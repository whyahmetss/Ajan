# =====================================================================
#  AJAN BOT - Ayarlar
#  Her şeyi buradan değiştir. Koda dokunmana gerek yok.
# =====================================================================

# --- Çalışma modu ---
#   sinyal   : sadece analiz eder, karar yazar, emir ATMAZ
#   onay     : emir atmadan önce konsolda "e/h" diye sana sorar   (ÖNERİLEN BAŞLANGIÇ)
#   otomatik : sormaz, kurallara uyan her kararı uygular
# Tek seferlik deneme için config'i değiştirmeden: python main.py --bir-kez --mod sinyal
mod: onay
onay_zaman_asimi_sn: 120  # Onay modunda bu sürede cevap gelmezse işlem açılmaz

# Gerçek hesapta çalışmayı engeller. true olmak ZORUNDA: false ise bot hiç başlamaz.
# Ayrıca kodda her emirden önce hesabın demo olduğu kontrol edilir (config ile kapatılamaz).
sadece_demo: true

zaman_dilimi: H1          # Tarama zaman dilimi: M15, M30, H1, H4
ust_zaman_dilimi: H4      # Trend teyidi için üst zaman dilimi
tarama_bar: 1000          # Her sembol için kaç mum çekilsin (EMA200'ün oturması için >= 1000)
mum_kapanis_gecikme_sn: 15  # Mum kapandıktan kaç sn sonra taransın
magic: 260611             # Botun emirlerini tanımak için kimlik numarası
# Broker sunucu saatinin UTC farkı (saat). Boş bırak: en taze tick'ten otomatik bulunur.
sunucu_utc_ofset_saat: null

# --- Hangi piyasalar taranacak? ---
# Broker'ın MT5'teki sembol klasör yolunda (path) bu kelimeler aranır. SIRA ÖNEMLİ: ilk eşleşen
# sınıf kazanır (ör. "Indices\Major" önce endeks olarak yakalansın diye forex en sonda).
# "python araclar.py semboller" komutuyla kendi broker'ındaki yolları görüp burayı düzeltebilirsin.
piyasalar:
  kripto: ["crypto", "kripto", "coin"]
  emtia:  ["metal", "gold", "silver", "commod", "energ", "oil"]
  endeks: ["indic", "index", "indeks", "cash", "stock ind"]
  forex:  ["forex", "fx", "major", "minor", "exotic", "cross"]
# Yolunda bunlar geçen semboller hiç taranmaz (hisse, ETF, tahvil)
haric_yol_kelimeleri: ["stock", "share", "equit", "etf", "bond", "hisse"]

# Doluysa SADECE bunlar taranır (başlangıçta küçük liste ile denemek iyi fikir)
# Örnek: ["EURUSD", "GBPUSD", "XAUUSD", "US100", "GER40", "BTCUSD", "ETHUSD"]
manuel_semboller: []
haric_semboller: []

# --- Tarayıcı (LLM'siz, ücretsiz ön eleme) ---
tarayici:
  max_aday: 3              # Her taramada ajanlara gönderilecek en iyi aday sayısı
  min_skor: 60             # 0-100 arası; altı direkt elenir
  max_spread_atr_orani: 0.12  # Spread, ATR'nin %12'sinden büyükse sembol elenir
  min_bar: 220

# --- LLM modelleri ---
# Model isimleri zamanla değişir. "python araclar.py modeller" ile
# hesabında açık olan güncel isimleri görüp buraya yaz.
llm:
  claude: claude-sonnet-5-5       # Karar (yargıç) için güçlü model
  claude_hizli: claude-haiku-5-5  # Ajanlar için ucuz/hızlı model
  grok: grok-4
  grok_hizli: grok-4-fast
  # Claude 5.5 modellerinde düşünme (thinking) varsayılan olarak açık ve düşünme tokenları bu
  # sınıra DAHİL. Düşük sınır cevabı yarıda keser (bot o adayı reddeder). Ödeme gerçek kullanıma göre.
  max_token: 16000
  max_token_grok: 4000            # grok-4 reasoning modeli: düşünme tokenları dahil olabilir (Aşama 5'te ölçülecek)
  claude_efor:                    # low | medium | high | xhigh | max (eski modellerde boş bırak)
    ajan: low
    yargic: medium
  claude_yedek_model: true        # Claude isteği reddederse (refusal) sunucu yedek Claude modeline sorar
  zaman_asimi_sn: 120
  max_yeniden_deneme: 2           # sadece geçici hatalarda (bağlantı, 429, 5xx); 400/401/404 tekrarlanmaz
  fiyat_usd_mtok:                 # [giriş, çıkış] USD / 1M token; maliyet raporu için. Bilinmiyorsa boş.
    claude-sonnet-5-5: [2.0, 10.0]
    claude-haiku-5-5: [0.10, 0.50]
    grok-4: null
    grok-4-fast: null

# Hangi ajan hangi modeli kullansın? (claude | claude_hizli | grok | grok_hizli)
# Boğa ve Ayı'yı farklı modellere vermek "yankı odası" etkisini azaltır.
ajanlar:
  boga:  claude_hizli
  ayi:   grok_hizli
  makro: grok_hizli
  risk:  claude_hizli

# Son karar: claude | grok | ikisi
#   ikisi = Claude ve Grok ayrı ayrı karar verir, İKİSİ DE onaylarsa işlem açılır
karar_modu: ikisi
min_destek_oyu: 2        # Boğa/Makro/Risk'ten en az kaçı "DESTEK" demeli
ayi_veto_guven: 85       # Ayı ajanı bu güvenle "KARSI" derse işlem direkt iptal (Ayı hata verirse de iptal)
min_karar_guven: 65      # Yargıcın güveni bunun altındaysa işlem yok

# --- Derin analiz: TradingAgents (isteğe bağlı, yavaş ve pahalı) ---
# Hızlı ajanların onayladığı adaylar ayrıca TradingAgents'a sorulur.
# Kurulum: pip install git+https://github.com/TauricResearch/TradingAgents.git
derin_analiz:
  aktif: false
  saglayici: anthropic        # anthropic | xai
  derin_model: claude-sonnet-5-5
  hizli_model: claude-haiku-5-5
  tartisma_turu: 1
  eslesme_yoksa_gecir: false  # Yahoo karşılığı olmayan sembolde işlem açılsın mı?

# --- Risk (BU KISIM KODDA SABİT, LLM DEĞİŞTİREMEZ; lotu LLM ne artırır ne azaltır) ---
risk:
  islem_basi_risk_yuzde: 0.5    # Her işlemde bakiyenin max %0.5'i riske
  gunluk_max_zarar_yuzde: 2.0   # Broker sunucu gününde: gerçekleşen + açık stoplar + yeni işlem riski
                                # bu sınırı aşacaksa yeni işlem açılmaz
  max_acik_pozisyon: 4
  max_ayni_doviz: 2             # Aynı dövize (ör. USD) bağlı en fazla 2 pozisyon
  sl_atr_carpan: 1.5            # Stop = giriş ± 1.5 x ATR
  tp_r: 2.0                     # Hedef = 2R (riskin 2 katı)
  breakeven_r: 1.0              # Mum kapanışında 1R kârdaysa stop girişe çekilir
  trailing_baslangic_r: 1.5     # Mum kapanışında 1.5R'den sonra ATR ile takip eden stop
  trailing_atr_carpan: 1.2
  max_kayma_r: 0.3              # Emir anındaki fiyat, LLM'lerin analiz ettiği fiyattan bu kadar R uzaksa iptal
  max_sapma_puan: 20            # Emir fiyat sapması toleransı (point, alt sınır)
  max_sapma_r: 0.05             # ... ya da stop mesafesinin bu katı (hangisi büyükse)

# --- Haber filtresi ---
haber:
  aktif: true
  blackout_dk: 30          # Yüksek etkili haberden 30 dk önce/sonra yeni işlem yok
  kaynak: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
  takvim_yoksa_islem_yok: true  # Takvim alınamazsa / bayatsa yeni işlem açılmaz
  max_bayatlik_saat: 6

# --- Backtest (python araclar.py backtest) ---
backtest:
  isinma_bar: 1000         # İlk bu kadar mum sadece indikatör ısınması (canlıdaki tarama_bar ile aynı)
  kilit_orani: 0.2         # Son %20: KİLİTLİ (sınırı ilk çalıştırmada kayitlar/kilit.json'a yazılır)
  egitim_orani: 0.7        # Kalan dönemin ilk %70'i eğitim, son %30'u test
  bakiye: 10000            # Min lot uygunluğu ve % getiri hesabı için varsayılan hesap büyüklüğü
  komisyon_lot: 0.0        # Lot başına gidiş-dönüş komisyon (hesap para birimi). Broker'ına göre doldur.
  spread_carpani: 1.0      # Maliyet stres testi: 1.5 / 2.0
  swap: true               # Sembolün bugünkü swap oranlarıyla gecelik swap

# Konsol yerine dosyaya da log yazılsın
log_klasoru: kayitlar
